name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile all Python modules
        run: |
          python -m compileall -q veritas autonomous app evaluations tests

      - name: Run unit / integration tests
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Import smoke check
        run: |
          python -c "from veritas.hashing import compute_content_hash; from veritas.payment_config import PaymentConfig; print('ok')"

      - name: Basic secret pattern scan
        run: |
          set -e
          if grep -RInE --exclude-dir=.git --exclude-dir=.github \
            -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'sk_live_[0-9a-zA-Z]{20,}' \
            -e 'xox[baprs]-[0-9a-zA-Z-]{10,}' \
            . ; then
            echo "Possible secrets detected in repository content"
            exit 1
          fi
          echo "No obvious secret patterns found"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r requirements.txt
      - name: Bandit (high severity must fail)
        run: |
          bandit -r veritas autonomous app -lll -q
      - name: pip-audit
        run: |
          pip-audit -r requirements.txt

  lint-structure:
    name: Structure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f requirements.txt
          test -f .github/workflows/ci.yml
          test -f .github/dependabot.yml
          test -d veritas
          test -d autonomous
          test -d app
          echo "Required structure OK"
