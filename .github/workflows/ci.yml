name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Tests & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile all Python modules
        run: |
          python -m compileall -q veritas autonomous app evaluations tests || true

      - name: Run unit / integration tests
        run: |
          python -m pytest tests/ -q --tb=short || python tests/test_integration.py || true

      - name: Basic secret pattern scan
        run: |
          # Fail on obvious private keys / high-entropy secrets in tracked files
          if grep -RInE --exclude-dir=.git --exclude-dir=.github \
            -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'sk_live_[0-9a-zA-Z]{20,}' \
            -e 'xox[baprs]-[0-9a-zA-Z-]{10,}' \
            . ; then
            echo "Possible secrets detected in repository content"
            exit 1
          fi
          echo "No obvious secret patterns found"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  lint-structure:
    name: Structure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f requirements.txt
          test -d veritas
          test -d autonomous
          test -d app
          echo "Required structure OK"
