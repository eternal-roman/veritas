name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies (hash-pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Compile all Python modules
        run: |
          python -m compileall -q veritas tests scripts

      - name: Import all modules
        run: |
          python -c "import veritas.server, veritas.autonomous.control_plane, veritas.evaluations.harness, veritas.pipeline, veritas.identity, veritas.constitution, veritas.support, veritas.safeurl, veritas.payer, veritas.ledger, veritas.metering, veritas.pricing, veritas.observability, veritas.ops_cli, veritas.providers, veritas.buyer_payment, veritas.diligence, veritas.counterparty, veritas.diligence_cli, veritas.verifier"
          # veritas.diligence and veritas.payer import each other, so import
          # each first in its own process. A cycle that breaks in only one
          # order would otherwise pass here and fail for a user.
          python -c "import veritas.diligence, veritas.payer"
          python -c "import veritas.payer, veritas.diligence"

      - name: Lint (ruff)
        run: |
          ruff check veritas tests scripts

      - name: Run unit / integration tests
        run: |
          python -m pytest tests/ -q --tb=short

      # The cycles also run as tests; this exercises the script entry point an
      # operator would use against their own instance, including --out.
      - name: Dogfooding cycles
        run: |
          python scripts/dogfood_cycle1.py --out /tmp/cycle1.json
          python scripts/dogfood_cycle2.py --out /tmp/cycle2.json
          python scripts/dogfood_cycle3.py --out /tmp/cycle3.json
          python scripts/dogfood_cycle4.py --out /tmp/cycle4.json

      - name: Evaluation harness must meet quality gates
        run: |
          python - <<'PY'
          import sys
          from veritas.evaluations.harness import run_full_harness

          report = run_full_harness()
          failures = []

          if report["fidelity"]["citation_fidelity"] < 1.0:
              failures.append(f"citation fidelity {report['fidelity']['citation_fidelity']} < 1.0")
          if not report["fidelity"]["all_custody_valid"]:
              failures.append("custody chain invalid on at least one query")
          if report["refusal"]["discrimination"] <= 0.0:
              failures.append("refusal does not discriminate supported from unsupported")
          if not report["unavailability_honesty"]["correct"]:
              failures.append("outage reported as no_evidence, or billed")

          for f in failures:
              print(f"QUALITY GATE FAILED: {f}")
          sys.exit(1 if failures else 0)
          PY

      - name: Payment model — bounded invariant check must hold
        run: |
          python -m veritas.evaluations.payment_model

      - name: Basic secret pattern scan
        run: |
          set -e
          if grep -RInE --exclude-dir=.git --exclude-dir=.github \
            -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'sk_live_[0-9a-zA-Z]{20,}' \
            -e 'xox[baprs]-[0-9a-zA-Z-]{10,}' \
            . ; then
            echo "Possible secrets detected in repository content"
            exit 1
          fi
          echo "No obvious secret patterns found"

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install security tools (hash-pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Bandit (medium and high severity must fail)
        run: |
          bandit -r veritas scripts -ll -q

      # Covers runtime AND dev/optional dependencies. This replaces the
      # dependency-review action, which could never run here (it requires the
      # repository's Dependency graph feature and errored before analysing
      # anything). pip-audit runs on every push and pull request and audits
      # the full pinned tree, so removing that job widened coverage rather
      # than narrowing it. After the hash install, audit the installed tree
      # (and the lockfiles as a second view of the same pins).
      - name: pip-audit (installed tree + lockfiles)
        run: |
          pip-audit
          pip-audit -r requirements.lock
          pip-audit -r requirements-dev.lock

  package:
    name: Package build & install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The tooling that builds a published artifact is part of that artifact's
      # supply chain, so it comes from the hashed lock rather than whatever
      # PyPI serves at the moment the job runs.
      - name: Install build tooling (hash-pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*

      # The runtime closure is installed from the hashed lock first, then the
      # wheel with --no-deps. Two things follow: every dependency in the
      # smoke-tested environment is hash-verified, and `pip check` then proves
      # the pinned closure actually satisfies the wheel's declared
      # requirements — a drift between pyproject and requirements.lock fails
      # here instead of at a buyer's install.
      - name: Install wheel over the hash-pinned runtime closure and smoke-test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --require-hashes -r requirements.lock
          /tmp/venv/bin/pip install --no-deps dist/*.whl
          /tmp/venv/bin/pip check
          cd /tmp
          /tmp/venv/bin/python - <<'PY'
          import importlib.util
          import veritas, veritas.server, veritas.autonomous.control_plane, veritas.evaluations.harness
          from veritas.pipeline import run_research

          r = run_research("What is x402?", allow_network=False)
          assert r["status"] == "completed" and r["custody_valid"], r["status"]
          # The wheel must ship exactly one top-level package.
          for stray in ("autonomous", "app", "evaluations"):
              assert importlib.util.find_spec(stray) is None, f"stray top-level package: {stray}"
          print("wheel OK:", veritas.__version__)
          PY
          test -x /tmp/venv/bin/veritas-server

      # The SBOM's subject is the venv above — the wheel and exactly its
      # hash-pinned runtime closure, which is what `pip install
      # veritas-research` gives a buyer. Generating it from the CI job instead
      # would over-report by ~100 dev-only packages that never ship, producing
      # a plausible document that answers the wrong question.
      #
      # cyclonedx-py comes from the hashed lock, so the generator is itself
      # pinned rather than fetched at run time. No soft-fail: if the SBOM
      # cannot be produced, or does not match the lock, the job fails.
      - name: Generate CycloneDX SBOM for the published artifact
        run: |
          mkdir -p sbom
          cyclonedx-py environment /tmp/venv \
            --output-format JSON \
            --output-reproducible \
            --output-file sbom/veritas-artifact.cdx.json

      - name: SBOM must describe exactly the locked runtime closure
        run: |
          python - <<'PY'
          import json, re, sys

          with open("sbom/veritas-artifact.cdx.json", encoding="utf-8") as fh:
              bom = json.load(fh)

          def norm(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          listed = {norm(c["name"]): c["version"] for c in bom.get("components", [])}
          locked = {
              norm(m.group(1)): m.group(2)
              for m in re.finditer(
                  r"^([A-Za-z0-9._-]+)==([^\s\\]+)",
                  open("requirements.lock", encoding="utf-8").read(),
                  re.M,
              )
          }
          # The package itself is the SBOM's subject, not one of its components.
          listed.pop("veritas-research", None)
          listed.pop("pip", None)
          listed.pop("setuptools", None)

          if listed != locked:
              only_sbom = {k: v for k, v in listed.items() if locked.get(k) != v}
              only_lock = {k: v for k, v in locked.items() if listed.get(k) != v}
              print("SBOM does not match requirements.lock")
              print("  in SBOM, differing/extra:", only_sbom)
              print("  in lock, differing/missing:", only_lock)
              sys.exit(1)

          leaked = set(listed) & {"pytest", "ruff", "bandit", "twine", "build", "pip-audit"}
          if leaked:
              print(f"SBOM subject is wrong — dev tooling present: {sorted(leaked)}")
              sys.exit(1)

          print(f"SBOM OK: {len(listed)} components, CycloneDX {bom['specVersion']}")
          PY

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/veritas-artifact.cdx.json
          if-no-files-found: error

  docker:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build image
        run: |
          docker build -t veritas-research:ci .
      # Build-only: pushing to a registry (GHCR) needs a permissions decision
      # a maintainer must make; see ROADMAP P.7.
      #
      # This build is what verifies the image's hash-pinned install path: the
      # Dockerfile installs requirements.lock with --require-hashes, then the
      # package with --no-deps, then runs `pip check`. A lock that does not
      # satisfy the package's declared dependencies fails here.

  lint-structure:
    name: Structure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Required files present
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f LICENSE
          test -f AGENTS.md
          test -f pyproject.toml
          test -f requirements.txt
          test -f requirements-dev.txt
          test -f requirements.lock
          test -f requirements-dev.lock
          test -f .github/workflows/ci.yml
          test -f .github/dependabot.yml
          test -d veritas
          test -d tests
          echo "Required structure OK"
