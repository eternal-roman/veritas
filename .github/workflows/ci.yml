name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile all Python modules
        run: |
          python -m compileall -q veritas tests scripts

      - name: Import all modules
        run: |
          python -c "import veritas.server, veritas.autonomous.control_plane, veritas.evaluations.harness, veritas.pipeline, veritas.identity, veritas.constitution, veritas.payer, veritas.replay, veritas.providers, veritas.buyer_payment"

      - name: Lint (ruff)
        run: |
          ruff check veritas tests scripts

      - name: Run unit / integration tests
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Evaluation harness must meet quality gates
        run: |
          python - <<'PY'
          import sys
          from veritas.evaluations.harness import run_full_harness

          report = run_full_harness()
          failures = []

          if report["fidelity"]["citation_fidelity"] < 1.0:
              failures.append(f"citation fidelity {report['fidelity']['citation_fidelity']} < 1.0")
          if not report["fidelity"]["all_custody_valid"]:
              failures.append("custody chain invalid on at least one query")
          if report["refusal"]["discrimination"] <= 0.0:
              failures.append("refusal does not discriminate supported from unsupported")
          if not report["unavailability_honesty"]["correct"]:
              failures.append("outage reported as no_evidence, or billed")

          for f in failures:
              print(f"QUALITY GATE FAILED: {f}")
          sys.exit(1 if failures else 0)
          PY

      - name: Payment model — bounded invariant check must hold
        run: |
          python -m veritas.evaluations.payment_model

      - name: Basic secret pattern scan
        run: |
          set -e
          if grep -RInE --exclude-dir=.git --exclude-dir=.github \
            -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'sk_live_[0-9a-zA-Z]{20,}' \
            -e 'xox[baprs]-[0-9a-zA-Z-]{10,}' \
            . ; then
            echo "Possible secrets detected in repository content"
            exit 1
          fi
          echo "No obvious secret patterns found"

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Bandit (high severity must fail)
        run: |
          bandit -r veritas -lll -q

      # Covers runtime AND dev/optional dependencies. This replaces the
      # dependency-review action, which could never run here (it requires the
      # repository's Dependency graph feature and errored before analysing
      # anything). pip-audit runs on every push and pull request and audits
      # the full pinned tree, so removing that job widened coverage rather
      # than narrowing it.
      - name: pip-audit (runtime and dev dependencies)
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

  package:
    name: Package build & install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install wheel in a clean venv and smoke-test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/python - <<'PY'
          import importlib.util
          import veritas, veritas.server, veritas.autonomous.control_plane, veritas.evaluations.harness
          from veritas.pipeline import run_research

          r = run_research("What is x402?", allow_network=False)
          assert r["status"] == "completed" and r["custody_valid"], r["status"]
          # The wheel must ship exactly one top-level package.
          for stray in ("autonomous", "app", "evaluations"):
              assert importlib.util.find_spec(stray) is None, f"stray top-level package: {stray}"
          print("wheel OK:", veritas.__version__)
          PY
          test -x /tmp/venv/bin/veritas-server

  docker:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          docker build -t veritas-research:ci .
      # Build-only: pushing to a registry (GHCR) needs a permissions decision
      # a maintainer must make; see ROADMAP P.7.

  lint-structure:
    name: Structure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required files present
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f LICENSE
          test -f AGENTS.md
          test -f pyproject.toml
          test -f requirements.txt
          test -f requirements-dev.txt
          test -f .github/workflows/ci.yml
          test -f .github/dependabot.yml
          test -d veritas
          test -d tests
          echo "Required structure OK"
