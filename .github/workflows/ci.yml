name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile all Python modules
        run: |
          python -m compileall -q veritas autonomous app evaluations tests

      - name: Import all top-level modules
        run: |
          python -c "import app.main, autonomous.control_plane, evaluations.harness, veritas.pipeline, veritas.identity"

      - name: Run unit / integration tests
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Evaluation harness must meet quality gates
        run: |
          python - <<'PY'
          import sys
          from evaluations.harness import run_full_harness

          report = run_full_harness()
          failures = []

          if report["fidelity"]["citation_fidelity"] < 1.0:
              failures.append(f"citation fidelity {report['fidelity']['citation_fidelity']} < 1.0")
          if not report["fidelity"]["all_custody_valid"]:
              failures.append("custody chain invalid on at least one query")
          if report["refusal"]["discrimination"] <= 0.0:
              failures.append("refusal does not discriminate supported from unsupported")
          if not report["unavailability_honesty"]["correct"]:
              failures.append("outage reported as no_evidence, or billed")

          for f in failures:
              print(f"QUALITY GATE FAILED: {f}")
          sys.exit(1 if failures else 0)
          PY

      - name: Basic secret pattern scan
        run: |
          set -e
          if grep -RInE --exclude-dir=.git --exclude-dir=.github \
            -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'sk_live_[0-9a-zA-Z]{20,}' \
            -e 'xox[baprs]-[0-9a-zA-Z-]{10,}' \
            . ; then
            echo "Possible secrets detected in repository content"
            exit 1
          fi
          echo "No obvious secret patterns found"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Bandit (high severity must fail)
        run: |
          bandit -r veritas autonomous app -lll -q

      - name: pip-audit
        run: |
          pip-audit -r requirements.txt

  lint-structure:
    name: Structure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f requirements.txt
          test -f requirements-dev.txt
          test -f .github/workflows/ci.yml
          test -f .github/dependabot.yml
          test -d veritas
          test -d autonomous
          test -d app
          echo "Required structure OK"
