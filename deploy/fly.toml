# Fly.io app definition. TLS is terminated by Fly.
# This file does not create an app. `fly apps create` and `fly secrets set`
# are operator steps. See docs/deploy/PUBLIC_HOST.md.

app = "veritas-signals"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  VERITAS_HOST = "0.0.0.0"
  VERITAS_PORT = "8000"
  VERITAS_RUNTIME_DIR = "/data/runtime"
  VERITAS_NETWORK = "eip155:84532"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "4s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "veritas_runtime"
  destination = "/data"
