[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-research"
dynamic = ["version"]
description = "Evidence-grounded research service for agents: hash-chained custody, Bayesian updating, explicit refusal, and x402 payment."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "agents",
    "x402",
    "research",
    "evidence",
    "provenance",
    "custody",
    "bayesian",
    "payments",
    "usdc",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Buyer-side signing for the Phase 0.1 testnet harness. Optional: the engine
# and server never sign anything, and production custody keeps keys out of
# this process entirely (ROADMAP 3.2).
signing = ["eth_account>=0.13"]
# MCP stdio surface (veritas-mcp). Optional: the module imports without it;
# serving requires it.
mcp = ["mcp>=1.0,<2"]
dev = [
    "eth_account>=0.13",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
veritas-server = "veritas.server:main"
veritas-agent = "veritas.agent_cli:main"
veritas-mcp = "veritas.mcp_server:main"
veritas-ops = "veritas.ops_cli:main"
veritas-diligence = "veritas.diligence_cli:main"

[project.urls]
Homepage = "https://github.com/eternal-roman/veritas"
Repository = "https://github.com/eternal-roman/veritas"
Issues = "https://github.com/eternal-roman/veritas/issues"
Roadmap = "https://github.com/eternal-roman/veritas/blob/main/ROADMAP.md"

[tool.setuptools.dynamic]
version = { attr = "veritas.__version__" }

[tool.setuptools.packages.find]
include = ["veritas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines in docstrings/tables are accepted where they aid readability.
ignore = ["E501"]

[tool.setuptools.package-data]
veritas = ["py.typed"]
