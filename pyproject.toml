[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-research"
version = "0.5.0"
description = "Evidence-grounded research service for agents, with custody, Bayesian updating, refusal, and x402 payment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Zero-key web retrieval. Without it, only Wikipedia and the DuckDuckGo
# Instant Answer fallback are available; the service reports the missing
# provider rather than pretending it searched.
retrieval = ["ddgs>=6.0"]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["veritas", "autonomous", "evaluations", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
